<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08111f" />
    <title>GitHub Issues Wall Display</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="dashboard-shell">
      <header class="dashboard-header">
        <div>
          <p class="eyebrow">GITHUB / ISSUE PULSE</p>
          <h1 id="repository-title">Loading repository…</h1>
          <p class="subtitle">Most active open issues, ranked by conversation and reactions.</p>
        </div>
        <div class="header-status" aria-live="polite">
          <span id="status-dot" class="status-dot is-loading"></span>
          <span id="status-label">Connecting</span>
        </div>
      </header>

      <section class="control-bar" aria-label="Dashboard controls">
        <form id="repository-form" class="repository-form">
          <label for="repository-input">Repository</label>
          <input id="repository-input" name="repository" placeholder="owner/repository" autocomplete="off" />
          <button type="submit">Load issues</button>
        </form>
        <div class="refresh-summary">
          <span>Auto-refresh: <strong>5 min</strong></span>
          <span>Updated <strong id="last-updated">—</strong></span>
          <button id="refresh-button" class="icon-button" type="button" aria-label="Refresh issues now">↻</button>
        </div>
      </section>

      <section id="message-panel" class="message-panel" hidden aria-live="polite"></section>
      <section id="issues-grid" class="issues-grid" aria-live="polite" aria-busy="true"></section>

      <footer class="dashboard-footer">
        <span>Interaction score = comments + reactions</span>
        <span>Open issues only · GitHub REST API</span>
      </footer>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>
